# ============================================================
# Master Configuration File
# ============================================================

# -------------------- General --------------------
general:
  # Seed for reproducibility (applied in R and Python)
  seed: 20260741

  # Output directory for trained models and logs
  output_dir: "data/rl_runs/schema5_seed_20260741"

  # Device for PyTorch: "cuda" or "cpu"
  device: "cuda"

  # If true, run only a few episodes for testing
  smoke_test: false

  # Verbose logging (prints actions, gradients, etc.)
  verbose: false

# -------------------- Return Data Contract --------------------
data:
  # Defaults reproduce the original seven-asset adjusted-level input. External
  # panels use a frozen per-window daily-log-return file and manifest; they
  # must never reuse a dimension-mismatched seven-asset checkpoint.
  returns_file: "data/portfolio_B_7assets_2013.csv"
  returns_kind: "adjusted_levels"
  returns_manifest: ""

# -------------------- Vine Copula & Data --------------------
vine:
  # Retained only for legacy benchmark scripts. RL uses the fixed NN-driven
  # dynamic t-vine below and does not re-estimate rolling-window vines.
  L: 250

  # NN-driven fully dynamic D-vine settings. All 21 unconditional/conditional
  # edge networks are fit on training data once; snapshots are causal forecasts.
  model: "nn_dynamic_t_vine"
  nn_epochs: 200
  nn_learning_rate: 0.001
  nn_patience: 20
  nn_model_dir: "data/nn_vine_models"
  # 0 means all d-1 trees. The separate 30-50 asset scalability protocol fixes
  # this to 3 before return access to keep state dimension and fitting cost sane.
  truncation_level: 0

  # Reference asset column index (1‑based)
  ref_col: 7

  # Number of simulations for CVaR estimation per step
  # 512 gives about 26 observations in the 5% tail per state. Report a
  # sensitivity check at 1,024/2,048; storing 2,000 for every replay state is
  # prohibitively expensive and did not create independent historical data.
  n_sim_cvar: 512

  # Number of CPU cores for parallel vine simulation
  sim_cores: 128

  # Paths to pre‑computed returns (if files exist, they will be loaded)
  pretrain_returns_file: "data/pretrain_returns.qs"
  finetune_returns_file: "data/finetune_returns.qs"

  # Marginals/pseudo-observations fitted only through the training cutoff.
  training_marginals_file: "data/training_marginal_results.RData"

  # Path to benchmark results (for evaluation comparison)
  benchmark_results_file: "data/benchmark_results.RData"

# -------------------- Reinforcement Learning Environment --------------------
environment:
  # CRRA risk aversion coefficient (gamma) for utility
  gamma: 2.0

  # CVaR penalty coefficient.  The earlier value (0.01) allowed a policy with
  # roughly 11% monthly 95%-CVaR to collapse to a one-long/one-short corner at
  # the 1.5x gross cap.  This calibrated starting value makes the cumulative
  # tail penalty commensurate with the terminal-wealth utility increment.  It
  # remains a preregistered sensitivity parameter, never tuned on final OOS.
  lambda: 0.05

  # Turnover penalty coefficient (kappa)
  kappa: 0.001

  # Episode length (number of monthly rebalancing steps)
  T: 24

  # Initial wealth
  w0: 100000

  # LSTM lookback window (number of historical states)
  seq_len: 30

  # Trading days per monthly holding period. Marginals are fitted to daily data.
  holding_days: 21

  # Self-financing long-short mandate. Gross leverage is sum(abs(weights));
  # net exposure is sum(weights). 1.5x gross with 1.0x net permits 125% long
  # and 25% short in the most concentrated admissible portfolio.
  gross_leverage: 1.5
  net_exposure: 1.0
  # Institutional position limits.  At full risk the long and short books are
  # projected onto capped simplexes, so leverage remains attainable without a
  # one-asset 125% corner.  The limits require at least three long positions
  # and two short positions when both books are fully deployed.
  max_long_weight: 0.60
  max_short_weight: 0.20

  # Annualised implementation costs. A short book is not free: stock-loan
  # fees are charged monthly, as is cash borrowing when net exposure exceeds 1.
  short_borrow_rate: 0.03
  cash_borrow_rate: 0.02

  # Optimise CRRA utility of terminal episode wealth via dense telescoping
  # utility increments, rather than one-period CRRA of each monthly return.
  utility_mode: "terminal_wealth_crra"

# -------------------- Pre-training Stage --------------------
pretraining:
  # Number of episodes
  episodes: 1000

  # Batch size for replay buffer sampling
  batch_size: 128

  # Exploration is applied to raw actor outputs.  0.30 produced unnecessary
  # month-to-month reallocations after the random warm-up; 0.15 retains broad
  # action support without dominating the bounded direction head.
  noise_scale: 0.15

  # Exponential decay rate for noise
  noise_decay: 0.998

  # Number of gradient updates per environment step
  # One update per new transition avoids the observed early actor collapse
  # after about 3,000 gradient steps while reducing training time materially.
  updates_per_step: 1

  # Uniform random logit actions are useful only before the synthetic replay
  # buffer has broad support. This counter is persisted in the checkpoint and
  # must not restart when historical fine-tuning begins.
  random_exploration_steps: 1000

  # Fail closed before historical fine-tuning when a deterministic, noise-free
  # replay of the final policy on a fixed held-in synthetic slice is collapsed.
  # These are mandate/behaviour checks, not return targets, and therefore
  # cannot reward historical backtest overfitting.
  behavior_gate_window: 100
  max_mean_leverage_gate: 0.95
  max_mean_gross_cap_fraction: 0.75
  # Boundary contact is diagnostic, not a failure: a valid constrained optimum
  # may bind a hard cap, and tightening a cap mechanically increases contact.
  # Fail instead on deterministic diversification and actual limit violations.
  warn_position_cap_fraction: 0.75
  min_mean_normalized_entropy: 0.70
  min_q05_normalized_entropy: 0.50
  min_mean_effective_positions: 2.50
  max_position_limit_violation: 1.0e-6
  max_gate_gross_mae: 1.0e-5
  max_mean_turnover: 1.00

# -------------------- Fine-tuning Stage --------------------
finetuning:
  # The generator currently produces 61 overlapping historical trajectories.
  # `episodes` is the expected number of distinct trajectories, not an
  # instruction to replay them eight times. A purged final training-prefix
  # block selects the number of passes; the selected count is then refit once
  # on all 61 trajectories before the locked OOS evaluation.
  episodes: 61
  batch_size: 64
  noise_scale: 0.05
  noise_decay: 0.995
  updates_per_step: 1
  random_exploration_steps: 0

  # Fine-tuning is deliberately conservative relative to synthetic
  # pre-training. The earlier equal learning rates/three updates per step
  # memorised the 61 overlapping trajectories and saturated leverage.
  lr_actor: 2e-5
  lr_critic: 1e-4

  # Purged chronological model selection. The last 24 pre-holdout months are
  # validation outcomes; every fit episode whose 24-month target overlaps that
  # block is purged. After choosing the pass count, all historical trajectories
  # are used for the final refit, satisfying the all-history protocol without
  # using the final 24-month OOS holdout for tuning.
  # A single 24-month validation path is too small to adaptively choose among
  # many passes.  Use one preregistered pass; retain the purged validation run
  # as a diagnostic only, then refit once on every historical trajectory.
  max_selection_passes: 1
  validation_patience: 1
  validation_min_delta: 0.005

  # Path to a pre‑trained model to load (overrides the default)
  # If not set, the script will look in the output directory.
  load_model_path: ""

# -------------------- LSTM-TD3 Agent --------------------
agent:
  # Actor learning rate
  lr_actor: 3e-5

  # Critic learning rate
  lr_critic: 1e-4

  # Must be 1.0 for the telescoping terminal-wealth utility objective.
  discount: 1.0

  # Target network soft‑update rate (tau)
  tau: 0.005

  # Number of hidden units in LSTM and fully‑connected layers
  hidden: 64

  # Number of LSTM layers
  num_layers: 1

  # Replay buffer capacity
  replay_capacity: 100000

  # A small allocation-entropy regulariser prevents the deterministic actor's
  # rank-partitioned books from becoming one-hot. This is a concentration
  # control, not a claim that TD3 itself is stochastic.
  entropy_coef: 0.005
  # Smoothly bound the cross-sectional score vector before its interior
  # capped-simplex maps. A generous bound preserves the ability to
  # reach 1.5x gross while preventing numerically extreme actor outputs.
  direction_logit_bound: 5.0
  # Temperature of the smooth interior capped-simplex map.  A value of 1.5
  # preserves score discrimination while preventing the projector itself from
  # pinning an asset to its hard limit and creating a zero-gradient boundary.
  projection_temperature: 1.50
  # Start the explicit leverage gate near an unlevered allocation.  The policy
  # may increase it when the learned risk-adjusted Q function supports doing so.
  initial_leverage_gate: 0.10
  # A soft constrained-control penalty is activated only above 80% of the
  # admissible leverage range (mean gross 1.40x for this mandate).  It prevents
  # a state-independent boundary solution while leaving the 1.50x hard cap
  # available when the learned risk-adjusted Q advantage is strong enough.
  leverage_soft_target: 0.80
  leverage_penalty_coef: 0.25
  policy_delay: 2
  target_policy_noise: 0.1
  target_noise_clip: 0.25
  deterministic_algorithms: true
  # Full float32 is the publication default.  The schema-2 run's actor GradScaler
  # never grew above 32768 while the critic scaler did, consistent with hidden
  # overflow resets/skipped actor steps.  AMP may be benchmarked separately.
  use_amp: false

  # Persist compact optimiser/value diagnostics every N gradient updates.
  diagnostic_interval: 100

  # Gradient clipping norm
  grad_clip_norm: 1.0

# -------------------- Evaluation --------------------
evaluation:
  # Locked historical holdout. It is excluded from marginal/vine fitting and
  # fine-tuning, and used once for final performance reporting.
  periods: 24

  # Number of evaluation episodes (different random seeds)
  # Historical backtesting has one realised path; repeated seeds are not
  # independent observations and must not be averaged as if they were.
  n_eval_seeds: 1

  # Base seed for evaluation (seeds are n_eval_seeds + i)
  eval_seed: 20260741

  # Environment parameters used for evaluation (can differ from training)
  eval_gamma: 2.0
  eval_lambda: 0.05
  eval_kappa: 0.001

  # Directory where the trained models are stored
  model_dir: "data/rl_runs/schema5_seed_20260741"

# -------------------- Publication Replications --------------------
publication:
  # Predeclared before final OOS evaluation. Twenty runs are the minimum for
  # uncertainty across stochastic RL optimisation; report every completed seed.
  seeds:
    - 20260741
    - 20260742
    - 20260743
    - 20260744
    - 20260745
    - 20260746
    - 20260747
    - 20260748
    - 20260749
    - 20260750
    - 20260751
    - 20260752
    - 20260753
    - 20260754
    - 20260755
    - 20260756
    - 20260757
    - 20260758
    - 20260759
    - 20260760
  minimum_successful_seeds: 20
